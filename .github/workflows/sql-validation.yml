name: SQL Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SQLFluff
        run: pip install sqlfluff==4.3.0
      - name: Parse T-SQL
        shell: bash
        run: |
          for sql_file in setup.sql sql/*.sql; do
            echo "Parsing $sql_file"
            sqlfluff parse --dialect tsql "$sql_file" >/dev/null
          done
