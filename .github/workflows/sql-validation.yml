name: SQL Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SQLFluff
        run: pip install sqlfluff==4.3.0
      - name: Validate sqlcmd include references
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          setup = Path("setup.sql").read_text(encoding="utf-8")
          missing = []
          for raw in re.findall(r"^\\s*:r\\s+(.+?)\\s*$", setup, flags=re.MULTILINE):
              include_path = Path(raw.strip().strip('"')).as_posix().replace("\\", "/")
              if not Path(include_path).is_file():
                  missing.append(include_path)

          if missing:
              print("Missing sqlcmd include files:")
              for path in missing:
                  print(f" - {path}")
              raise SystemExit(1)

          expected = [
              "sql/01-create-database.sql",
              "sql/02-schema.sql",
              "sql/03-seed.sql",
              "sql/04-views.sql",
              "sql/06-stored-procedure.sql",
              "sql/07-validation.sql",
          ]
          actual = [
              Path(raw.strip().strip('"')).as_posix().replace("\\", "/")
              for raw in re.findall(r"^\\s*:r\\s+(.+?)\\s*$", setup, flags=re.MULTILINE)
          ]
          if actual != expected:
              print("Unexpected setup.sql include order:")
              print("Expected:", expected)
              print("Actual:  ", actual)
              raise SystemExit(1)

          print("All sqlcmd include references resolve and setup order is valid.")
          PY

      - name: Parse T-SQL
        shell: bash
        run: |
          files=()
          [[ -f setup.sql ]] && files+=(setup.sql)
          while IFS= read -r -d '' sql_file; do
            files+=( "$sql_file" )
          done < <(find sql -type f -name '*.sql' -print0 2>/dev/null || true)

          if (( ${#files[@]} == 0 )); then
            echo "No SQL files found to parse."
            exit 0
          fi

          for sql_file in "${files[@]}"; do
            echo "Parsing $sql_file"
            sqlfluff parse --dialect tsql "$sql_file" >/dev/null
          done


  integration:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: "Str0ng_Test_Passw0rd!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Str0ng_Test_Passw0rd! -C -Q 'SELECT 1' || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sqlcmd
        shell: bash
        run: |
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          curl -fsSL https://packages.microsoft.com/config/ubuntu/24.04/prod.list |             sed 's#^deb #deb [signed-by=/usr/share/keyrings/microsoft-prod.gpg] #' |             sudo tee /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18
          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"

      - name: Wait for SQL Server
        shell: bash
        env:
          SQLCMDPASSWORD: "Str0ng_Test_Passw0rd!"
        run: |
          for attempt in {1..30}; do
            if sqlcmd -S localhost,1433 -U sa -C -Q "SELECT 1" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "SQL Server did not become ready."
          exit 1

      - name: Run setup and validation against SQL Server
        shell: bash
        env:
          SQLCMDPASSWORD: "Str0ng_Test_Passw0rd!"
        run: |
          sqlcmd -S localhost,1433 -U sa -C -b -i setup.sql
