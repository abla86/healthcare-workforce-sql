name: SQL Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SQLFluff
        run: pip install sqlfluff==4.3.0
      - name: Parse T-SQL
        shell: bash
        run: |
          files=()
          [[ -f setup.sql ]] && files+=(setup.sql)
          while IFS= read -r -d '' sql_file; do
            files+=( "$sql_file" )
          done < <(find sql -type f -name '*.sql' -print0 2>/dev/null || true)

          if (( ${#files[@]} == 0 )); then
            echo "No SQL files found to parse."
            exit 0
          fi

          for sql_file in "${files[@]}"; do
            echo "Parsing $sql_file"
            sqlfluff parse --dialect tsql "$sql_file" >/dev/null
          done
